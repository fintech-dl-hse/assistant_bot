[tool.ruff]
target-version = "py310"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # module-level import not at top — used intentionally in some handlers
]

[tool.ruff.lint.per-file-ignores]
"src/cli_*.py" = ["F401"]  # CLI scripts may have unused imports during development
